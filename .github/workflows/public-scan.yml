name: Public tree gates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned scanner
        env:
          GOBIN: ${{ runner.temp }}/scan-bin
        run: go install github.com/zricethezav/gitleaks/v8@v8.16.0
      - name: Check public tree
        run: python3 -I scripts/scan_public.py --root . --gitleaks "$RUNNER_TEMP/scan-bin/gitleaks"
