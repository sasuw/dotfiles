config:
  MD004: false
  MD007: false
  MD013: false
  MD060: false
  MD024:
    siblings_only: true
  MD033:
    allowed_elements:
      - br
      - details
      - summary
      - kbd
globs:
  - "**/*.md"
ignores:
  - "node_modules"
  - ".git"
  - "template/snippets/*.md"
  - "templates/*.md"
  - "**/references/*.md"
  - "memory/*.md"
