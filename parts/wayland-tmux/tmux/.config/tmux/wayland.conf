# Default command for every copy binding that does not name its own:
# Enter in copy mode, double-click, triple-click.
set -s copy-command 'wl-copy'

bind -T copy-mode MouseDragEnd1Pane \
  send-keys -X copy-pipe-and-cancel 'wl-copy'

bind -T copy-mode-vi MouseDragEnd1Pane \
  send-keys -X copy-pipe-and-cancel 'wl-copy'
